name: Build Un-signed iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inject API Keys (Gemini & Kakao)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          mkdir -p lib/config
          printf "class ApiKeys {\n  static const String geminiApiKey = '%s';\n  static const String kakaoRestApiKey = '%s';\n}\n" "$GEMINI_KEY" "$KAKAO_KEY" > lib/config/api_keys.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Unsigned iOS Release
        run: flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Bottari_Unsigned.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bottari_iOS_IPA
          path: Bottari_Unsigned.ipa