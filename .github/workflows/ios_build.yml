name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 3. Inject Gemini API Key from GitHub Secret
        env:
          SECRET_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p lib/config
          printf "class ApiKeys {\n  static const String geminiApiKey = '%s';\n}\n" "$SECRET_KEY" > lib/config/api_keys.dart

      - name: 4. Install Dependencies
        run: flutter pub get

      - name: 5. Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: 6. Package as .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Bottari_iOS.ipa Payload

      - name: 7. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bottari-iOS-IPA
          path: Bottari_iOS.ipa